<!doctype html>
<html lang="pt-BR">

    <meta property="og:type" content="website" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://jlb-analytics.onrender.com/" />
    <meta name="twitter:title" content="JLB Analytics — Educação em Mercados Preditivos" />

    <meta name="twitter:image" content="https://jlb-analytics.onrender.com/og-image.png" />

    <!-- Dados estruturados (JSON-LD é bloco de dados — não executa, CSP não bloqueia) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "JLB Analytics",
          "url": "https://jlb-analytics.onrender.com/",
          "description": "Plataforma de educação quantitativa para mercados preditivos.",
          "inLanguage": "pt-BR"
        },
        {
          "@type": "Organization",
          "name": "JLB Analytics",
          "url": "https://jlb-analytics.onrender.com/",
          "logo": "https://jlb-analytics.onrender.com/icons/icon-512.png"
        }
      ]
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme color para mobile — acompanha o tema do sistema -->
    <meta name="theme-color" content="#16161f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f2" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.json" />
    <!-- PWA / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JLB Assets" />
  </head>

  <body>
    <!-- Tema salvo aplicado ANTES do React montar (script externo p/ CSP script-src 'self') -->
    <script src="/theme-init.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
