name: Backup do banco (gratis)

# Backup AUTOMATICO e GRATIS do Postgres do Supabase — alternativa ao PITR (pago).
# Roda pg_dump semanal, comprime, CRIPTOGRAFA (AES256) e guarda como artefato do
# GitHub por 90 dias. Rodando em minutos gratis do Actions; zero custo.
#
# Pre-requisito (2 secrets em: repo > Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL     -> Supabase > Project Settings > Database > Connection string
#                          (formato postgresql://postgres:SENHA@db.<ref>.supabase.co:5432/postgres)
#   BACKUP_PASSPHRASE   -> uma senha forte SUA (guarde-a: sem ela o backup nao abre)
#
# Restaurar: baixe o artefato e rode
#   gpg --decrypt backup-XXXX.sql.gz.gpg | gunzip | psql "$SUPABASE_DB_URL"
on:
  schedule:
    - cron: "0 4 * * 0"    # todo domingo, 04:00 UTC
  workflow_dispatch: {}     # disparo manual pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar pg_dump 17 (PGDG)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump + compressao + criptografia (AES256)
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$PGCONN" || { echo "::error::Falta o secret SUPABASE_DB_URL"; exit 1; }
          test -n "$PASS"   || { echo "::error::Falta o secret BACKUP_PASSPHRASE"; exit 1; }
          STAMP=$(date -u +%Y%m%d-%H%M)
          /usr/lib/postgresql/17/bin/pg_dump "$PGCONN" --no-owner --no-privileges \
            | gzip \
            | gpg --batch --yes --passphrase "$PASS" --symmetric --cipher-algo AES256 \
                  -o "backup-$STAMP.sql.gz.gpg"
          echo "Backup criado:"; ls -lh backup-*.sql.gz.gpg

      - name: Guardar como artefato (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: "*.sql.gz.gpg"
          retention-days: 90
          if-no-files-found: error
